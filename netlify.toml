[build]
  command = "npm run build"
  publish = "dist"

# Required for trailing-slash redirect to work without loops
[build.processing.html]
  pretty_urls = true

# Strip trailing slashes — matches Astro trailingSlash:'never' config
# Prevents 301 redirect chains that cause "Page with redirect" in GSC
[[redirects]]
  from = "/:splat/"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404
